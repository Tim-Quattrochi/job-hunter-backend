# Docker Compose configuration for local development
# For production, deploy to Railway/Render and use Upstash Redis
services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use REDIS_URL from .env, default to local Redis if not set
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      # Use REDIS_URL from .env, default to local Redis if not set
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  # Local Redis for development (use Upstash Redis in production)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
